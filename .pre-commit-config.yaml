exclude: 'node_modules|.git'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "payrexx_integration.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                payrexx_integration/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                payrexx_integration/templates/includes/.*|
                payrexx_integration/public/js/lib/.*
            )$


  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                payrexx_integration/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                payrexx_integration/templates/includes/.*|
                payrexx_integration/public/js/lib/.*
            )$

  # linter.yml blocks a push on frappe's semgrep rules, but nothing ran them
  # locally: `pre-commit run --all-files` could be clean and the base branch
  # still go red on push, which is what happened to ilanga_app on 2026-08-29.
  #
  # The rules are cloned from the same repository CI uses and cached under
  # ~/.cache, so only the first run needs network. semgrep itself is installed
  # into pre-commit's own venv -- nobody needs it on PATH.
  #
  # If the rules cannot be fetched the hook passes with a notice rather than
  # blocking every commit on an offline machine. That makes this an early
  # warning, not a gate: linter.yml remains the gate, and it also runs
  # `r/python.lang.correctness`, a registry lookup deliberately left out here.
  - repo: local
    hooks:
      - id: semgrep-frappe
        name: "Run frappe semgrep rules"
        language: python
        additional_dependencies: ["semgrep==1.174.0"]
        pass_filenames: false
        # Scans the app rather than the staged files (the rules need whole-file
        # context), but types_or keeps a docs-only or JSON-only commit from
        # paying for it.
        types_or: [python, javascript]
        entry: bash
        args:
          - -c
          - |
            CACHE="${HOME}/.cache/frappe-semgrep-rules"
            if [ ! -d "${CACHE}/rules" ]; then
              git clone --depth 1 -q https://github.com/frappe/semgrep-rules "${CACHE}" 2>/dev/null \
                || { echo "frappe semgrep rules unavailable (offline?) - skipped; linter.yml still enforces them"; exit 0; }
            fi
            exec semgrep --config "${CACHE}/rules" --error --quiet .

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
