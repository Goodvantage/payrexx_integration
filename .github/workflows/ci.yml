name: CI

on:
  workflow_dispatch:
  push:
    branches: [version-16]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Forgejo act_runner: jobs run inside containers, so services are reached
    # by hostname (mariadb:3306, redis-cache:6379), not host port mappings.
    services:
      redis-cache:
        image: redis:alpine
      redis-queue:
        image: redis:alpine
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: System dependencies and CI user
        run: |
          apt-get update -qq
          # cron: bench init aborts without /usr/bin/crontab.
          apt-get install -y -qq git curl ca-certificates cron mariadb-client >/dev/null
          npm install -g yarn >/dev/null
          # bench refuses to run as root; job containers run as root.
          useradd -m -s /bin/bash runner
          chown -R runner "$GITHUB_WORKSPACE"

      - name: Setup bench
        run: |
          pip install -q frappe-bench
          touch /tmp/ci.log && chmod 666 /tmp/ci.log
          sudo -u runner -H env "PATH=$PATH" "TOKEN=$TOKEN" bash -c '
            set -e
            exec > >(tee -a /tmp/ci.log) 2>&1
            git config --global url."https://x-access-token:${TOKEN}@code.goodvantage.cloud/".insteadOf "https://code.goodvantage.cloud/"
            cd /home/runner
            bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16 --python "$(which python)" /home/runner/frappe-bench
            cd /home/runner/frappe-bench
            bench set-config -g redis_cache redis://redis-cache:6379
            bench set-config -g redis_queue redis://redis-queue:6379
            bench set-config -g redis_socketio redis://redis-queue:6379
          '
        env:
          TOKEN: ${{ secrets.CI_FORGEJO_TOKEN }}

      - name: Get apps
        run: |
          sudo -u runner -H env "PATH=$PATH" "WS=$GITHUB_WORKSPACE" bash -c '
            set -e
            exec > >(tee -a /tmp/ci.log) 2>&1
            cd /home/runner/frappe-bench
            bench get-app erpnext --branch version-16
            bench get-app payments https://github.com/frappe/payments --branch version-16
            bench get-app payrexx_integration "$WS"
            bench setup requirements --dev
          '
        env:
          CI: 'Yes'

      - name: Site setup and install apps
        run: |
          sudo -u runner -H env "PATH=$PATH" bash -c '
            set -e
            exec > >(tee -a /tmp/ci.log) 2>&1
            cd /home/runner/frappe-bench
            # frappe logger wants <bench>/test_site/logs before the site exists
            mkdir -p ~/logs logs test_site/logs
            bench new-site --db-host mariadb --db-root-password root --admin-password admin test_site
            mkdir -p sites/test_site/logs
            # frappe throttles User creation at 60/hour in production; every
            # upstream Frappe app raises this for CI (see erpnext, hrms,
            # payments, non_profit .github/helper/site_config.json).
            bench --site test_site set-config -p throttle_user_limit 1000
            bench --site test_site install-app erpnext
            bench --site test_site install-app payments
            bench --site test_site install-app payrexx_integration
            /home/runner/frappe-bench/env/bin/python -c "
            import frappe
            frappe.init(\"test_site\", sites_path=\"/home/runner/frappe-bench/sites\")
            frappe.connect()
            from erpnext.setup.setup_wizard.setup_wizard import setup_complete
            setup_complete(frappe._dict({\"country\": \"Switzerland\", \"currency\": \"CHF\", \"company_name\": \"Test Company\", \"company_abbr\": \"TC\", \"chart_of_accounts\": \"Standard\", \"fy_start_date\": \"2026-01-01\", \"fy_end_date\": \"2026-12-31\"}))
            frappe.db.commit()
            frappe.destroy()
            "
            bench build
          '
        env:
          CI: 'Yes'

      - name: Run Tests
        run: |
          sudo -u runner -H env "PATH=$PATH" bash -c '
            set -e
            exec > >(tee -a /tmp/ci.log) 2>&1
            cd /home/runner/frappe-bench
            bench --site test_site set-config allow_tests true
            bench --site test_site run-tests --app payrexx_integration --coverage
          '
        env:
          TYPE: server

      # This Forgejo exposes no Actions log API and its web log route needs a
      # browser session, so a failing run publishes its own tail as an issue.
      - name: Post failure log
        if: failure()
        run: |
          export TAIL=$(tail -c 12000 /tmp/ci.log 2>/dev/null || echo "no captured log")
          python3 - <<'PYEOF'
          import os, json, urllib.request
          fence = chr(96) * 3
          body = "Run %s\n\n%s\n%s\n%s" % (os.environ.get('RUNID', '?'), fence, os.environ.get('TAIL', ''), fence)
          payload = json.dumps({'title': 'CI failure log: payrexx_integration', 'body': body}).encode()
          req = urllib.request.Request(os.environ['API'] + '/repos/Goodvantage/payrexx_integration/issues',
                data=payload, method='POST',
                headers={'Content-Type': 'application/json', 'Authorization': 'token ' + os.environ['GT']})
          urllib.request.urlopen(req, timeout=30)
          PYEOF
        env:
          GT: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}
          RUNID: ${{ github.run_id }}
