name: CI

on:
  workflow_dispatch:
  push:
    branches: [version-16]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Forgejo act_runner: jobs run inside containers, so services are reached
    # by hostname (mariadb:3306, redis-cache:6379), not host port mappings.
    services:
      redis-cache:
        image: redis:alpine
      redis-queue:
        image: redis:alpine
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: System dependencies and CI user
        run: |
          apt-get update -qq
          # cron: bench init aborts without /usr/bin/crontab.
          apt-get install -y -qq git curl ca-certificates cron mariadb-client >/dev/null
          npm install -g yarn >/dev/null
          # bench refuses to run as root; job containers run as root.
          useradd -m -s /bin/bash runner
          chown -R runner "$GITHUB_WORKSPACE"

      - name: Setup bench
        run: |
          set -o pipefail
          pip install -q frappe-bench
          touch /tmp/ci.log && chmod 666 /tmp/ci.log
          sudo -u runner -H env "PATH=$PATH" "TOKEN=$TOKEN" bash -c '
            set -e
            git config --global url."https://x-access-token:${TOKEN}@code.goodvantage.cloud/".insteadOf "https://code.goodvantage.cloud/"
            cd /home/runner
            bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16 --python "$(which python)" /home/runner/frappe-bench
            cd /home/runner/frappe-bench
            bench set-config -g redis_cache redis://redis-cache:6379
            bench set-config -g redis_queue redis://redis-queue:6379
            bench set-config -g redis_socketio redis://redis-queue:6379
          ' 2>&1 | tee -a /tmp/ci.log
        env:
          TOKEN: ${{ secrets.CI_FORGEJO_TOKEN }}

      - name: Get apps
        run: |
          set -o pipefail
          sudo -u runner -H env "PATH=$PATH" "WS=$GITHUB_WORKSPACE" bash -c '
            set -e
            cd /home/runner/frappe-bench
            bench get-app erpnext --branch version-16
            bench get-app payments https://github.com/frappe/payments --branch version-16
            bench get-app payrexx_integration "$WS"
            bench setup requirements --dev
          ' 2>&1 | tee -a /tmp/ci.log
        env:
          CI: 'Yes'

      - name: Site setup and install apps
        run: |
          set -o pipefail
          sudo -u runner -H env "PATH=$PATH" bash -c '
            set -e
            cd /home/runner/frappe-bench
            # frappe logger wants <bench>/test_site/logs before the site exists
            mkdir -p ~/logs logs test_site/logs
            bench new-site --db-host mariadb --db-root-password root --admin-password admin test_site
            mkdir -p sites/test_site/logs
            # frappe throttles User creation at 60/hour in production; every
            # upstream Frappe app raises this for CI (see erpnext, hrms,
            # payments, non_profit .github/helper/site_config.json).
            bench --site test_site set-config -p throttle_user_limit 1000
            bench --site test_site install-app erpnext
            bench --site test_site install-app payments
            bench --site test_site install-app payrexx_integration
            /home/runner/frappe-bench/env/bin/python -c "
            import frappe
            frappe.init(\"test_site\", sites_path=\"/home/runner/frappe-bench/sites\")
            frappe.connect()
            from erpnext.setup.setup_wizard.setup_wizard import setup_complete
            setup_complete(frappe._dict({\"country\": \"Switzerland\", \"currency\": \"CHF\", \"company_name\": \"Test Company\", \"company_abbr\": \"TC\", \"chart_of_accounts\": \"Standard\", \"fy_start_date\": \"2026-01-01\", \"fy_end_date\": \"2026-12-31\"}))
            frappe.db.commit()
            frappe.destroy()
            "
            # erpnext setup_complete builds the company but does not set the
            # frappe-level setup_complete flag, so the desk still redirects to
            # the Welcome wizard and every browser spec times out. The same
            # call workflow_visualizer uses, proven green:
            bench --site test_site execute frappe.utils.install.complete_setup_wizard
            bench build
          ' 2>&1 | tee -a /tmp/ci.log
        env:
          CI: 'Yes'

      - name: Run Tests
        run: |
          set -o pipefail
          sudo -u runner -H env "PATH=$PATH" bash -c '
            set -e
            cd /home/runner/frappe-bench
            bench --site test_site set-config allow_tests true
            bench --site test_site run-tests --app payrexx_integration --coverage
          ' 2>&1 | tee -a /tmp/ci.log
        env:
          TYPE: server

      - name: Seed Sandbox browser fixture
        run: |
          set -o pipefail
          cat > /tmp/seed_sandbox.py <<'SEEDEOF'
          import frappe
          frappe.init("test_site", sites_path="/home/runner/frappe-bench/sites")
          frappe.connect()
          frappe.flags.in_test = True
          name = "Sandbox"
          settings = (
              frappe.get_doc("Payrexx Settings", name)
              if frappe.db.exists("Payrexx Settings", name)
              else frappe.new_doc("Payrexx Settings")
          )
          settings.update({
              "gateway_name": "Sandbox",
              "instance_name": "ci-sandbox",
              "api_base_domain": "payrexx.com",
              "api_secret": "ci_not_live",
              "webhook_signing_key": "ci_not_live",
              "automation_user": "Administrator",
              "supported_currencies": "CHF",
          })
          settings.save(ignore_permissions=True)
          frappe.db.commit()
          frappe.destroy()
          SEEDEOF
          chown runner /tmp/seed_sandbox.py
          sudo -u runner -H env "PATH=$PATH" bash -c '
            cd /home/runner/frappe-bench
            env/bin/python /tmp/seed_sandbox.py
          ' 2>&1 | tee -a /tmp/ci.log

      - name: Install Playwright
        working-directory: ${{ github.workspace }}/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run core Playwright specs
        run: |
          set -o pipefail
          # bench serve runs as the CI user; nohup keeps it alive past the sudo shell.
          sudo -u runner -H env "PATH=$PATH" bash -c '
            cd /home/runner/frappe-bench
            nohup bench --site test_site serve --port 8000 > /tmp/bench-web.log 2>&1 &
            sleep 3
          ' 2>&1 | tee -a /tmp/ci.log
          timeout 120 bash -c 'until curl --fail --silent http://127.0.0.1:8000/api/method/ping > /dev/null; do sleep 2; done'
          cp /tmp/bench-web.log "$GITHUB_WORKSPACE/playwright/bench-web.log" || true
          cat /tmp/bench-web.log || true
          # Warm the desk bundle before the specs: the first /app request compiles
          # and serves a large bundle, and on this container runner that can
          # exceed the spec's own 30s locator timeout.
          curl --silent --max-time 120 -o /dev/null "http://127.0.0.1:8000/app/payrexx-settings" || true
          cd "$GITHUB_WORKSPACE/playwright"
          npx playwright test tests/payrexx_settings.spec.ts tests/pay_invoice_redirect.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
          FRAPPE_SITE: test_site
          FRAPPE_USERNAME: Administrator
          FRAPPE_PASSWORD: admin
          TEST_PAYREXX_SETTINGS: Sandbox

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: payrexx-playwright-failure
          if-no-files-found: ignore
          path: |
            playwright/bench-web.log
            playwright/playwright-report
            playwright/test-results

      # This Forgejo exposes no Actions log API and its web log route needs a
      # browser session, so a failing run publishes its own tail as an issue.
      - name: Post failure log
        if: failure()
        run: |
          # Full artifacts to the package registry - the only complete-log
          # channel this Forgejo has (no Actions log/artifact API).
          U="https://code.goodvantage.cloud/api/packages/Goodvantage/generic/ci-logs/run-${RUNID}"
          for f in "$GITHUB_WORKSPACE"/playwright/test-results/*/error-context.md; do
            [ -f "$f" ] && { echo "=== $f ==="; cat "$f"; } >> /tmp/ci.log
          done
          tar czf /tmp/test-results.tgz -C "$GITHUB_WORKSPACE/playwright" test-results 2>/dev/null \
            && curl -s -o /dev/null -u "Goodfred:${AT}" --upload-file /tmp/test-results.tgz \
                 "https://code.goodvantage.cloud/api/packages/Goodvantage/generic/ci-logs/run-${RUNID}/test-results.tgz" || true
          curl -s -o /dev/null -u "Goodfred:${AT}" --upload-file /tmp/ci.log "$U/ci.log" || true
          export TAIL=$(tail -c 12000 /tmp/ci.log 2>/dev/null || echo "no captured log")
          python3 - <<'PYEOF'
          import os, json, urllib.request
          fence = chr(96) * 3
          body = "Run %s - full log: curl -u <user>:<token> https://code.goodvantage.cloud/api/packages/Goodvantage/generic/ci-logs/run-%s/ci.log\n\n%s\n%s\n%s" % (os.environ.get('RUNID','?'), os.environ.get('RUNID','?'), fence, os.environ.get('TAIL',''), fence)
          payload = json.dumps({'title': 'CI failure log: payrexx_integration', 'body': body}).encode()
          req = urllib.request.Request(os.environ['API'] + '/repos/Goodvantage/payrexx_integration/issues',
                data=payload, method='POST',
                headers={'Content-Type': 'application/json', 'Authorization': 'token ' + os.environ['GT']})
          urllib.request.urlopen(req, timeout=30)
          PYEOF
        env:
          GT: ${{ secrets.GITHUB_TOKEN }}
          AT: ${{ secrets.CI_ARTIFACT_TOKEN }}
          API: ${{ github.api_url }}
          RUNID: ${{ github.run_id }}
