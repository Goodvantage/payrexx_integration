name: Linters

on:
  push:
    branches: [version-16]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linter:
    name: 'Frappe Linter'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - uses: pre-commit/action@v3.0.0

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Run Semgrep rules
        run: |
          set -o pipefail
          pip install semgrep
          semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness 2>&1 | tee -a /tmp/lint.log

      # This Forgejo has no Actions log API and the web log route needs a
      # browser session a token cannot produce, so a failing lint publishes its
      # own log. Without this the only way to see why the base branch went red
      # is to guess and reproduce locally.
      - name: Post failure log
        if: failure()
        run: |
          U="https://code.goodvantage.cloud/api/packages/Goodvantage/generic/ci-logs/run-${RUNID}"
          curl -s -o /dev/null -u "Goodfred:${AT}" --upload-file /tmp/lint.log "$U/lint-${JOBNAME}.log" || true
        env:
          AT: ${{ secrets.CI_ARTIFACT_TOKEN }}
          RUNID: ${{ github.run_id }}
          JOBNAME: semgrep

  deps-vulnerable-check:
    name: 'Vulnerable Dependency Check'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: actions/checkout@v6

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install and run pip-audit
        run: |
          set -o pipefail
          pip install pip-audit
          cd ${GITHUB_WORKSPACE}
          pip-audit --desc on . 2>&1 | tee -a /tmp/audit.log

      - name: Post failure log
        if: failure()
        run: |
          U="https://code.goodvantage.cloud/api/packages/Goodvantage/generic/ci-logs/run-${RUNID}"
          curl -s -o /dev/null -u "Goodfred:${AT}" --upload-file /tmp/audit.log "$U/lint-${JOBNAME}.log" || true
        env:
          AT: ${{ secrets.CI_ARTIFACT_TOKEN }}
          RUNID: ${{ github.run_id }}
          JOBNAME: pip-audit
